[package]
name = "terra-predict"
version = "0.1.0"
edition = "2021"
description = "Terra Predict: admin-less parimutuel YES/NO markets on Terra, resolved by an on-chain TWAP read from an Astroport pair. No oracle, no operator, no pause."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
cw-utils = "1.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
anyhow = "1.0"
cw-multi-test = "0.20"
