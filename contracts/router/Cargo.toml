[package]
name = "terra-swap-router"
version = "0.1.0"
edition = "2021"
description = "A router with no owner, no admin and no fee: one transaction swaps through pools on Terra Swap's and Astroport's factories, hands each swap's whole return to the next, and checks one minimum on what arrives."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
cw20 = "1.1"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
anyhow = "1.0"
cw-multi-test = "0.20"
cw20-base = { version = "1.1", features = ["library"] }
